name: Stale Issues and Pull Requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          operations-per-run: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,blocked
          exempt-pr-labels: pinned,security,blocked
          stale-issue-message: >
            This issue has been inactive for 30 days and is marked stale.
            Remove the stale label or comment if it is still active.
          stale-pr-message: >
            This pull request has been inactive for 30 days and is marked stale.
            Remove the stale label or comment if it is still active.
